sentence=Universal IMU library with Inbuilt Hardware & Software Sensor Fusion, I2C/SPI Auto-Detection, and Multi-IMU support.
paragraph=Supports popular IMUs including Bosch BNO055 (on-chip fusion), BNO080/085 (SH-2 hub), BMI160/BMI270; TDK InvenSense MPU-6050, MPU-6500, MPU-9250 (with DMP support), ICM-20948, ICM-42688; ST LSM6DSOX, LSM6DS3, LSM9DS1. Features automatic bus probing (I2C/SPI), on-chip hardware fusion offloading, high-performance Madgwick/Mahony 6/9-DoF filters, and clean multi-sensor orchestration for ESP32, STM32, and Arduino AVR.
category=Sensors
