; PlatformIO Project Configuration for COMET_IMU
; ================================================
; Supports ESP32, STM32, and Arduino AVR architectures

[platformio]
default_envs = esp32dev
src_dir = examples/01_AutoDetect_Any_IMU
lib_dir = .

[env]
framework = arduino
monitor_speed = 115200

; ========================================================
; ESP32 Environment (ESP32 DevKit, S3, C3)
; ========================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -O3

; ========================================================
; STM32 Environment (Nucleo F401RE, BluePill F103C8, etc.)
; ========================================================
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
build_flags = 
    -D SERIAL_UART_INSTANCE=1
    -O3

; ========================================================
; Arduino AVR (Uno, Nano, Mega 2560)
; ========================================================
[env:uno]
platform = atmelavr
board = uno
